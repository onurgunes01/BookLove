    // --- ANA UYGULAMA BİLEŞENİ ---
    function App() {
      // LocalStorage senkronizasyonu
      const STORAGE_KEY = 'bizim_kitaplik_ghpages_v1';
      
      const [books, setBooks] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error('LocalStorage okuma hatası:', e);
        }
        return INITIAL_CATALOG.map((b, i) => ({
          ...b,
          id: `book-${i + 1}`,
          rating: b.status === 'esim_okudu' ? 5 : 4.8,
          coupleNotes: {
            myNote: b.myNote || '',
            spouseNote: b.spouseNote || (b.status === 'esim_okudu' ? 'Eşimin en sevdiği ve kütüphanemizin baş köşesinde yer alan başyapıtlardan biri.' : ''),
            lastUpdated: '16 Ekim 2026'
          }
        }));
      });

      // Filtreleme State'leri
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all'); // 'all', 'esim_okudu', 'okunmadi', 'ben_okudum', 'ikimiz_de_okuduk', 'favorites'
      const [selectedPublishers, setSelectedPublishers] = useState([]);
      const [selectedGenres, setSelectedGenres] = useState([]);
      const [sortOption, setSortOption] = useState('title_asc');
      const [viewMode, setViewMode] = useState('grid');
      const [activeBook, setActiveBook] = useState(null);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isRandomModalOpen, setIsRandomModalOpen] = useState(false);
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      // Değişiklikleri LocalStorage'a kaydet (Samsung/Android cihazda uygulama kapatılıp açılsa bile korunur)
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
        } catch (e) {
          console.error('LocalStorage yazma hatası:', e);
        }
      }, [books]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      // Durum Değiştirme ('Sırada', 'Eşim Okudu', 'Ben Okudum', 'İkimiz de Okuduk')
      const handleStatusChange = (bookId, newStatus) => {
        setBooks(prev => prev.map(b => {
          if (b.id === bookId) {
            const updated = { ...b, status: newStatus };
            if (newStatus === 'esim_okudu') updated.isFavorite = true;
            return updated;
          }
          return b;
        }));
        if (activeBook && activeBook.id === bookId) {
          setActiveBook(prev => ({ ...prev, status: newStatus }));
        }
        showToast('Okuma durumu güncellendi: ' + STATUS_MAP[newStatus].short);
      };

      // Favori Aç/Kapat
      const handleToggleFavorite = (bookId, e) => {
        if (e) e.stopPropagation();
        setBooks(prev => prev.map(b => {
          if (b.id === bookId) {
            return { ...b, isFavorite: !b.isFavorite };
          }
          return b;
        }));
        if (activeBook && activeBook.id === bookId) {
          setActiveBook(prev => ({ ...prev, isFavorite: !prev.isFavorite }));
        }
      };

      // Çift Notu Kaydetme
      const handleSaveNotes = (bookId, myNote, spouseNote) => {
        setBooks(prev => prev.map(b => {
          if (b.id === bookId) {
            return {
              ...b,
              coupleNotes: {
                ...b.coupleNotes,
                myNote,
                spouseNote,
                lastUpdated: '16 Ekim 2026'
              }
            };
          }
          return b;
        }));
        showToast('Notlarınız kütüphaneye kaydedildi ✨');
      };

      // Yeni Kitap Ekleme
      const handleAddBook = (newBookData) => {
        const newBook = {
          ...newBookData,
          id: `custom-book-${Date.now()}`,
          isFavorite: newBookData.status === 'esim_okudu',
          rating: 5,
          coupleNotes: {
            myNote: '',
            spouseNote: '',
            lastUpdated: '16 Ekim 2026'
          }
        };
        setBooks(prev => [newBook, ...prev]);
        setIsAddModalOpen(false);
        showToast(`"${newBook.title}" kütüphanenize eklendi!`);
      };

      // İstatistikler
      const stats = useMemo(() => {
        const total = books.length;
        const esim = books.filter(b => b.status === 'esim_okudu').length;
        const sirada = books.filter(b => b.status === 'okunmadi').length;
        const ben = books.filter(b => b.status === 'ben_okudum').length;
        const ikimiz = books.filter(b => b.status === 'ikimiz_de_okuduk').length;
        const favs = books.filter(b => b.isFavorite).length;
        return { total, esim, sirada, ben, ikimiz, favs };
      }, [books]);

      // Yayınevleri ve Türler
      const publishers = useMemo(() => {
        const map = {};
        books.forEach(b => { map[b.publisher] = (map[b.publisher] || 0) + 1; });
        return Object.entries(map).sort((a, b) => b[1] - a[1]);
      }, [books]);

      const genres = useMemo(() => {
        const map = {};
        books.forEach(b => { map[b.genre] = (map[b.genre] || 0) + 1; });
        return Object.entries(map).sort((a, b) => b[1] - a[1]);
      }, [books]);

      // Filtreleme Mantığı
      const filteredBooks = useMemo(() => {
        return books.filter(book => {
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = book.title.toLowerCase().includes(q);
            const matchAuthor = book.author.toLowerCase().includes(q);
            const matchPub = book.publisher.toLowerCase().includes(q);
            if (!matchTitle && !matchAuthor && !matchPub) return false;
          }

          if (statusFilter === 'favorites' && !book.isFavorite) return false;
          if (statusFilter !== 'all' && statusFilter !== 'favorites' && book.status !== statusFilter) return false;
          if (selectedPublishers.length > 0 && !selectedPublishers.includes(book.publisher)) return false;
          if (selectedGenres.length > 0 && !selectedGenres.includes(book.genre)) return false;

          return true;
        }).sort((a, b) => {
          if (sortOption === 'title_asc') return a.title.localeCompare(b.title, 'tr');
          if (sortOption === 'title_desc') return b.title.localeCompare(a.title, 'tr');
          if (sortOption === 'author_asc') return a.author.localeCompare(b.author, 'tr');
          if (sortOption === 'pages_desc') return b.pages - a.pages;
          if (sortOption === 'pages_asc') return a.pages - b.pages;
          return 0;
        });
      }, [books, searchQuery, statusFilter, selectedPublishers, selectedGenres, sortOption]);

      const clearAllFilters = () => {
        setSearchQuery('');
        setStatusFilter('all');
        setSelectedPublishers([]);
        setSelectedGenres([]);
      };

      const hasActiveFilters = searchQuery || statusFilter !== 'all' || selectedPublishers.length > 0 || selectedGenres.length > 0;

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          {/* TOAST BİLDİRİM */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 border border-rose-500/50 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-sm animate-bounce">
              <span className="text-rose-400 font-bold">✓</span>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* ÜST HEADER / NAVİGASYON */}
          <header className="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              
              {/* Sol: Başlık & Logo */}
              <div className="flex items-center space-x-3 cursor-pointer" onClick={clearAllFilters}>
                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-rose-500 via-amber-600 to-rose-700 flex items-center justify-center shadow-lg shadow-rose-900/30">
                  <Icon name="book" size={22} className="text-white" />
                </div>
                <div>
                  <h1 className="font-serif text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    Bizim Kitaplığımız
                    <span className="hidden sm:inline-block text-xs font-sans font-medium px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">
                      Özel Kütüphane
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400 font-sans">Eşim ve Benim İçin Kişisel Koleksiyon</p>
                </div>
              </div>

              {/* Orta & Sağ: Özel Eşimin Okuduğu Kitaplar Butonu & Aksiyonlar */}
              <div className="flex items-center space-x-2 sm:space-x-3">
                {/* 🌸 ÖZEL VURGULU BUTON: Eşimin Okuduğu Kitaplar */}
                <button
                  onClick={() => setStatusFilter(statusFilter === 'esim_okudu' ? 'all' : 'esim_okudu')}
                  className={`flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all ${
                    statusFilter === 'esim_okudu'
                      ? 'bg-gradient-to-r from-rose-600 to-pink-600 text-white shadow-lg shadow-rose-900/40 ring-2 ring-rose-400'
                      : 'bg-rose-950/60 hover:bg-rose-900/70 text-rose-200 border border-rose-800/60 hover:border-rose-600'
                  }`}
                  title="Eşimin okuduğu tüm özel favori kitapları filtreler"
                >
                  <Icon name="heart-filled" size={16} className="text-rose-400" />
                  <span className="hidden sm:inline">Eşimin Okuduğu Kitaplar</span>
                  <span className="sm:hidden">Eşimin Kitapları</span>
                  <span className="bg-rose-900/90 text-rose-200 text-xs px-2 py-0.5 rounded-full border border-rose-700">
                    {stats.esim}
                  </span>
                </button>

                {/* Kura Çek (Ne Okusak?) */}

                      <button
                        onClick={() => handleStatusChange(activeBook.id, 'okunmadi')}
                        className={`py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition border ${
                          activeBook.status === 'okunmadi'
                            ? STATUS_MAP.okunmadi.activeBtn
                            : 'bg-slate-900 text-slate-400 hover:text-amber-300 border-slate-800 hover:border-amber-700'
                        }`}
                      >
                        <Icon name="clock" size={14} />
                        <span>Sırada</span>
                      </button>

                      {/* 2. Eşim Okudu */}
                      <button
                        onClick={() => handleStatusChange(activeBook.id, 'esim_okudu')}
                        className={`py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition border ${
                          activeBook.status === 'esim_okudu'
                            ? STATUS_MAP.esim_okudu.activeBtn
                            : 'bg-slate-900 text-slate-400 hover:text-rose-300 border-slate-800 hover:border-rose-700'
                        }`}
                      >
                        <Icon name="heart-filled" size={14} />
                        <span>Eşim Okudu</span>
                      </button>

                      {/* 3. Ben Okudum */}
                      <button
                        onClick={() => handleStatusChange(activeBook.id, 'ben_okudum')}
                        className={`py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition border ${
                          activeBook.status === 'ben_okudum'
                            ? STATUS_MAP.ben_okudum.activeBtn
                            : 'bg-slate-900 text-slate-400 hover:text-sky-300 border-slate-800 hover:border-sky-700'
                        }`}
                      >
                        <Icon name="check" size={14} />
                        <span>Ben Okudum</span>
                      </button>

                      {/* 4. İkimiz de Okuduk */}
                      <button
                        onClick={() => handleStatusChange(activeBook.id, 'ikimiz_de_okuduk')}
                        className={`py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition border ${
                          activeBook.status === 'ikimiz_de_okuduk'
                            ? STATUS_MAP.ikimiz_de_okuduk.activeBtn
                            : 'bg-slate-900 text-slate-400 hover:text-emerald-300 border-slate-800 hover:border-emerald-700'
                        }`}
                      >
                        <Icon name="sparkles" size={14} />
                        <span>İkimiz de Okuduk</span>
                      </button>

                    </div>
                  </div>

                  {/* 1 SAYFALIK ÖZET */}
                  <div className="bg-slate-950/40 rounded-2xl p-5 sm:p-6 border border-slate-800/80 space-y-4">
                    <h3 className="font-serif text-lg font-bold text-amber-200 flex items-center gap-2">
                      <Icon name="book" size={18} />
                      Kitabın 1 Sayfalık Edebi Özeti & Teması
                    </h3>
                    
                    {activeBook.lead && (
                      <p className="text-sm sm:text-base font-serif italic text-rose-300/90 pl-3 border-l-2 border-rose-500 py-1">
                        "{activeBook.lead}"
                      </p>
                    )}

                    <div className="space-y-1.5">
                      <span className="text-xs uppercase font-semibold text-slate-400 tracking-wider">
                        1. Başlangıç ve Edebi Atmosfer
                      </span>
                      <p className="text-sm text-slate-300 leading-relaxed font-sans">
                        {activeBook.p1 || 'Bu eser, dönemin sosyal yapısını ve karakterlerin iç dünyalarını benzersiz bir ustalıkla aktarmaktadır.'}
                      </p>
                    </div>

                    <div className="space-y-1.5">
                      <span className="text-xs uppercase font-semibold text-slate-400 tracking-wider">
                        2. Çatışma ve Tematik İnceleme (Spoiler-free)
                      </span>
                      <p className="text-sm text-slate-300 leading-relaxed font-sans">
                        {activeBook.p2 || 'Karakterler arasındaki psikolojik gerilimler ve ahlaki seçimler okuyucuyu derin düşüncelere sevk eder.'}
                      </p>
                    </div>

                    <div className="space-y-1.5">
                      <span className="text-xs uppercase font-semibold text-slate-400 tracking-wider">
                        3. Edebi Derinlik ve Çift Olarak Birlikte Okuma Tavsiyesi
                      </span>
                      <p className="text-sm text-slate-300 leading-relaxed font-sans">
                        {activeBook.p3 || 'Birlikte üzerine konuşmak, altı çizili cümleleri paylaşmak ve kütüphanemizde kalıcı bir iz bırakmak için kusursuz bir eser.'}
                      </p>
                    </div>
                  </div>

                  {/* ALINTILAR */}
                  {activeBook.quotes && activeBook.quotes.length > 0 && (
                    <div className="bg-slate-950/60 rounded-2xl p-4 sm:p-5 border border-slate-800">
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-semibold text-amber-300 uppercase tracking-wider flex items-center gap-1.5">
                          <Icon name="star" size={14} /> Kitaptan Unutulmaz Sözler
                        </span>
                        <button
                          onClick={() => {
                            navigator.clipboard.writeText(activeBook.quotes.join('\n\n'));
                            showToast('Alıntılar panoya kopyalandı 📋');
                          }}
                          className="text-xs text-slate-400 hover:text-white flex items-center gap-1 transition"
                        >
                          <Icon name="copy" size={13} />
                          <span>Kopyala</span>
                        </button>
                      </div>
                      <div className="space-y-2">
                        {activeBook.quotes.map((q, i) => (
                          <div key={i} className="text-xs sm:text-sm font-serif italic text-slate-300 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                            "{q}"
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* ÇİFTİN KİŞİSEL NOTLARI */}
                  <div className="bg-slate-950/60 rounded-2xl p-4 sm:p-5 border border-slate-800 space-y-4">
                    <span className="text-xs font-semibold text-rose-300 uppercase tracking-wider flex items-center gap-1.5">
                      <Icon name="heart" size={14} /> Bizim Özel Notlarımız & Değerlendirmemiz
                    </span>

                    <div>
                      <label className="block text-xs text-rose-300/80 mb-1 font-medium">
                        🌸 Eşimin Notu / Düşünceleri:
                      </label>
                      <textarea
                        defaultValue={activeBook.coupleNotes?.spouseNote || activeBook.spouseNote || ''}
                        id={`spouse-note-${activeBook.id}`}
                        rows={2}
                        placeholder="Eşinizin bu kitap hakkındaki düşüncesini buraya yazabilirsiniz..."
                        className="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700/80 text-xs sm:text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-sky-300/80 mb-1 font-medium">
                        📖 Benim Notum:
                      </label>
                      <textarea
                        defaultValue={activeBook.coupleNotes?.myNote || ''}
                        id={`my-note-${activeBook.id}`}
                        rows={2}
                        placeholder="Kendi okuma notunuzu buraya ekleyin..."
                        className="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700/80 text-xs sm:text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-sky-500"
                      />
                    </div>

                    <button
                      onClick={() => {
                        const sNote = document.getElementById(`spouse-note-${activeBook.id}`).value;
                        const mNote = document.getElementById(`my-note-${activeBook.id}`).value;
                        handleSaveNotes(activeBook.id, mNote, sNote);
                      }}
                      className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-white transition flex items-center gap-1.5"
                    >
                      <Icon name="check" size={14} />
                      <span>Notları Kaydet</span>
                    </button>
                  </div>

                </div>

                {/* Modal Kapat Footer */}
                <div className="p-4 border-t border-slate-800 bg-slate-950/80 flex items-center justify-between text-xs text-slate-400">
                  <span>Bizim Kitaplığımız • Özel Kütüphane</span>
                  <button
                    onClick={() => setActiveBook(null)}
                    className="px-5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-medium transition"
                  >
                    Kapat
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* YENİ KİTAP EKLE MODALI */}
          {/* ========================================================================= */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-lg w-full p-6 shadow-2xl">
                <div className="flex items-center justify-between mb-5 pb-3 border-b border-slate-800">
                  <h3 className="font-serif text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="plus" size={18} className="text-emerald-400" />
                    Kütüphanemize Yeni Kitap Ekle
                  </h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    handleAddBook({
                      title: form.title.value,
                      author: form.author.value,
                      publisher: form.publisher.value || 'Bilinmiyor',
                      genre: form.genre.value || 'Klasik',
                      pages: Number(form.pages.value) || 200,
                      year: Number(form.year.value) || new Date().getFullYear(),
                      status: form.status.value,
                      lead: form.lead.value || 'Kütüphanemize yeni eklenen değerli bir eser.',
                      p1: form.p1.value || 'Kitabın konusu ve genel atmosferi.',
                      p2: form.p2.value || 'Olay örgüsü ve edebi tahlil.',
                      p3: form.p3.value || 'Birlikte okumak için tavsiye edilen kitap.',
                      quotes: form.quotes.value ? [form.quotes.value] : []
                    });
                  }}
                  className="space-y-3.5 text-xs sm:text-sm"
                >
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">Kitap Adı *</label>
                    <input name="title" required placeholder="Örn: Saatleri Ayarlama Enstitüsü" className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Yazar *</label>
                      <input name="author" required placeholder="Örn: Ahmet Hamdi Tanpınar" className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Yayınevi</label>
                      <input name="publisher" placeholder="Örn: YKY, Can, Altın vb." className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Tür</label>
                      <select name="genre" className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white">
                        <option value="Türk Edebiyatı">Türk Edebiyatı</option>
                        <option value="Dünya Klasikleri">Dünya Klasikleri</option>
                        <option value="Polisiye & Gerilim">Polisiye & Gerilim</option>
                        <option value="Psikoloji & Felsefe">Psikoloji & Felsefe</option>
                        <option value="Bilim Kurgu">Bilim Kurgu</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Sayfa</label>
                      <input type="number" name="pages" defaultValue="250" className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Durum</label>
                      <select name="status" className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white">
                        <option value="okunmadi">Sırada (Okunmadı)</option>
                        <option value="esim_okudu">Eşim Okudu</option>
                        <option value="ben_okudum">Ben Okudum</option>
                        <option value="ikimiz_de_okuduk">İkimiz de Okuduk</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-300 mb-1">Giriş Cümlesi / Vurucu Alıntı</label>
                    <input name="lead" placeholder="Kitabı özetleyen tek cümle" className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white" />
                  </div>

                  <div>
                    <label className="block text-xs text-slate-300 mb-1">Kitap Özeti</label>
                    <textarea name="p1" rows={3} placeholder="Kitabın konusu ve genel atmosferi..." className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white" />
                  </div>

                  <div className="flex justify-end space-x-3 pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setIsAddModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300">İptal</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold shadow">Kitabı Ekle</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* NE OKUSAK? (KURA ÇEK) MODALI */}
          {/* ========================================================================= */}
          {isRandomModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full p-6 text-center shadow-2xl">
                <div className="w-16 h-16 rounded-2xl bg-amber-500/20 text-amber-400 mx-auto flex items-center justify-center mb-4">
                  <Icon name="dice" size={32} />
                </div>
                <h3 className="font-serif text-2xl font-bold text-white mb-1">Ne Okusak?</h3>
                <p className="text-xs text-slate-400 mb-5">Sırada bekleyen kitaplar arasından bu akşamın kurasını çekin</p>

                {(() => {
                  const unread = books.filter(b => b.status === 'okunmadi');
                  const pool = unread.length > 0 ? unread : books;
                  const picked = pool[Math.floor(Math.random() * pool.length)];

                  return (
                    <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5 mb-5 text-left">
                      <span className="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-800/40">
                        {picked.publisher}
                      </span>
                      <h4 className="font-serif text-xl font-bold text-white mt-2">{picked.title}</h4>
                      <p className="text-sm text-slate-300 mb-2">{picked.author} ({picked.pages} sayfa)</p>
                      <p className="text-xs text-slate-400 italic line-clamp-3">"{picked.lead}"</p>

                      <button
                        onClick={() => {
                          setIsRandomModalOpen(false);
                          setActiveBook(picked);
                        }}
                        className="mt-4 w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold shadow transition"
                      >
                        Özeti Aç ve Okumaya Başla →
                      </button>
                    </div>
                  );
                })()}

                <button
                  onClick={() => setIsRandomModalOpen(false)}
                  className="px-5 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-medium hover:text-white"
                >
                  Kapat
                </button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-auto border-t border-slate-900 bg-slate-950/80 py-6 text-center text-xs text-slate-500">
            <p>Bizim Kitaplığımız © 2026 • Eşim ve Benim İçin Sevgiyle Hazırlandı</p>
          </footer>

        </div>
      );
    }

    // Uygulamayı Başlat
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
